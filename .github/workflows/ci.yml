name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Syntax checks
        run: |
          node --check server.js
          node --check public/js/main.js
          node --check public/js/admin.js
          node --check public/js/player.js
          node --check lib/mercadopago-utils.js
